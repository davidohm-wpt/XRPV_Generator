<style>
  :root{
    --teal:#009999; --teal-dark:#00726f; --teal-tint:#e6f7f7;
    --ink:#1b2b2b; --paper:#ffffff; --line:#d7e4e3;
    --amber:#b3790a; --amber-tint:#fff6e5;
    --red:#c0392b; --red-tint:#fdecea;
    --green:#1e7a4c; --green-tint:#eaf7f0;
    --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    --sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#0f1717; --ink:#e8f0ef; --line:#1f3231; --teal-tint:#0d2626;
      --amber-tint:#2a2110; --red-tint:#2a1513; --green-tint:#0f271b;
    }
  }
  :root[data-theme="dark"]{
    --paper:#0f1717; --ink:#e8f0ef; --line:#1f3231; --teal-tint:#0d2626;
    --amber-tint:#2a2110; --red-tint:#2a1513; --green-tint:#0f271b;
  }
  *{box-sizing:border-box;}
  body{margin:0; font-family:var(--sans); background:var(--paper); color:var(--ink); -webkit-font-smoothing:antialiased;}
  .shell{max-width:1080px; margin:0 auto; padding:28px 20px 120px;}

  .app-header{display:flex; align-items:center; justify-content:space-between; gap:16px; padding-bottom:20px; border-bottom:2px solid var(--teal);}
  .brand{display:flex; align-items:center; gap:12px;}
  .brand-mark{width:38px; height:38px; border-radius:8px; background:var(--teal); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:15px; flex:none;}
  .brand-text h1{margin:0; font-size:17px; font-weight:700; letter-spacing:-.01em;}
  .brand-text p{margin:2px 0 0; font-size:12.5px; color:var(--teal-dark); opacity:.85;}
  .doc-no{font-family:var(--mono); font-size:12px; color:var(--ink); opacity:.6; text-align:right;}

  .stepper-wrap{margin:26px 0 30px; overflow-x:auto;}
  .stepper{display:flex; align-items:flex-start; gap:0; min-width:max-content;}
  .step-node{display:flex; flex-direction:column; align-items:center; gap:6px; min-width:96px; cursor:pointer;}
  .step-dot{width:30px; height:30px; border-radius:50%; border:2px solid var(--line); display:flex; align-items:center; justify-content:center; font-size:12.5px; font-weight:700; color:var(--ink); opacity:.55; background:var(--paper); transition:all .18s ease;}
  .step-node.active .step-dot{border-color:var(--teal); background:var(--teal); color:#fff; opacity:1;}
  .step-node.done .step-dot{border-color:var(--teal); background:var(--teal-tint); color:var(--teal-dark); opacity:1;}
  .step-node.done .step-dot::after{content:"✓"; font-size:13px;}
  .step-node.done .step-dot span{display:none;}
  .step-label{font-size:11.5px; text-align:center; line-height:1.25; max-width:104px; color:var(--ink); opacity:.7;}
  .step-node.active .step-label{opacity:1; font-weight:600; color:var(--teal-dark);}
  .step-connector{flex:1; height:2px; background:var(--line); min-width:22px; margin-top:15px;}
  .step-connector.done{background:var(--teal);}

  .card{background:var(--paper); border:1px solid var(--line); border-radius:10px; padding:22px 24px; margin-bottom:18px;}
  .card h2{margin:0 0 4px; font-size:15px; font-weight:700; color:var(--teal-dark); display:flex; align-items:center; gap:8px;}
  .card h3.subhead{font-size:13px; margin:20px 0 10px; font-weight:700; padding-top:16px; border-top:1px dashed var(--line);}
  .card h3.subhead.first{margin-top:14px; padding-top:0; border-top:none;}
  .card h4.minihead{font-size:11.5px; margin:0 0 8px; font-weight:700; opacity:.7; text-transform:uppercase; letter-spacing:.02em;}
  .card .sub{margin:0 0 18px; font-size:12.5px; opacity:.65;}
  .section-tag{display:inline-block; font-size:10.5px; font-weight:700; color:var(--teal-dark); background:var(--teal-tint); border-radius:5px; padding:2px 7px;}

  .config-row{display:flex; gap:24px; flex-wrap:wrap;}
  .config-block{flex:1; min-width:260px;}
  .config-block h3{font-size:13px; margin:0 0 10px; font-weight:700;}
  .lane-stepper{display:flex; align-items:center; gap:14px;}
  .lane-stepper button{width:38px; height:38px; border-radius:8px; border:1.5px solid var(--line); background:var(--paper); font-size:18px; cursor:pointer; color:var(--teal-dark); font-weight:700;}
  .lane-stepper button:hover{border-color:var(--teal);}
  .lane-stepper .lane-count{font-size:22px; font-weight:700; min-width:36px; text-align:center;}
  .toggle-row{display:flex; gap:10px;}
  .toggle-btn{flex:1; border:1.5px solid var(--line); border-radius:8px; padding:12px; text-align:center; cursor:pointer; font-size:13px; font-weight:600;}
  .toggle-btn.selected{border-color:var(--teal); background:var(--teal-tint); color:var(--teal-dark);}
  .config-summary{margin-top:18px; padding-top:16px; border-top:1px dashed var(--line); font-size:12.5px; opacity:.75;}

  .field-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:14px 16px;}
  .field-grid.cols-2{grid-template-columns:repeat(2,1fr);}
  .field-grid.cols-3{grid-template-columns:repeat(3,1fr);}
  .field-grid.cols-4{grid-template-columns:repeat(4,1fr);}
  @media (max-width:760px){.field-grid, .field-grid.cols-2, .field-grid.cols-3, .field-grid.cols-4{grid-template-columns:1fr 1fr;}}
  .field{display:flex; flex-direction:column; gap:5px;}
  .field.span-2{grid-column:span 2;}
  .field.span-3{grid-column:span 3;}
  .field label{font-size:11.5px; font-weight:600; opacity:.75;}
  .field input, .field select, .field textarea{border:1px solid var(--line); border-radius:6px; padding:8px 10px; font-size:13px; font-family:var(--sans); background:var(--paper); color:var(--ink);}
  .field input:focus, .field select:focus, .field textarea:focus{outline:2px solid var(--teal); outline-offset:1px; border-color:var(--teal);}
  .field.required label::after{content:" *"; color:var(--red);}
  .field-with-suffix{display:flex; align-items:center; gap:6px;}
  .field-with-suffix input{flex:1;}
  .unit-label{font-size:11.5px; opacity:.6; white-space:nowrap;}
  .cell-with-suffix{display:flex; align-items:center; gap:5px;}
  .cell-with-suffix input{flex:1; min-width:0;}

  table.tbl{width:100%; border-collapse:collapse; font-size:12.5px;}
  table.tbl th{text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:.03em; opacity:.55; padding:7px 8px; border-bottom:1px solid var(--line); white-space:nowrap;}
  table.tbl td{padding:7px 8px; border-bottom:1px solid var(--line); vertical-align:middle;}
  table.tbl tr:last-child td{border-bottom:none;}
  table.tbl input, table.tbl select{width:100%; border:1px solid var(--line); border-radius:6px; padding:5px 7px; font-size:12.5px; font-family:var(--sans); background:var(--paper); color:var(--ink);}
  table.tbl input[type=number]{font-family:var(--mono);}

  .note-col{opacity:.55; font-size:11.5px; max-width:220px;}
  .badge{display:inline-block; min-width:52px; padding:4px 8px; border-radius:5px; font-size:11.5px; font-weight:700; text-align:center;}
  .badge.pass{background:var(--green-tint); color:var(--green);}
  .badge.fail{background:var(--red-tint); color:var(--red);}
  .badge.wait{background:var(--line); color:var(--ink); opacity:.55;}
  .due-flag{color:var(--red); font-weight:700;}
  @media print{ .due-flag{color:inherit; font-weight:inherit;} }

  .callout{display:flex; gap:10px; align-items:flex-start; background:var(--teal-tint); border:1px solid var(--teal); border-radius:8px; padding:12px 14px; font-size:12.5px; color:var(--teal-dark); margin-bottom:18px;}
  .callout b{display:block; margin-bottom:2px;}
  .guide-note{font-size:11.5px; opacity:.6; margin:4px 0 14px;}

  .add-row-bar{display:flex; align-items:center; gap:10px; margin-top:14px; padding-top:14px; border-top:1px dashed var(--line); flex-wrap:wrap;}
  .add-row-bar input[type=number]{width:70px; border:1px solid var(--line); border-radius:6px; padding:6px 8px; text-align:center;}
  .btn-sm{border:1px solid var(--line); background:var(--paper); border-radius:6px; padding:6px 12px; font-size:12px; cursor:pointer; font-weight:600; color:var(--teal-dark);}
  .btn-sm:hover{border-color:var(--teal);}
  .btn-sm:disabled{opacity:.4; cursor:not-allowed;}
  .btn-sm.danger{color:var(--red);}
  .cap-note{font-size:11px; opacity:.5;}

  .diagram-wrap{display:flex; justify-content:center; margin-bottom:18px;}

  .sig-box{border:1.5px dashed var(--line); border-radius:10px; padding:16px; text-align:center;}
  .sig-preview{max-width:260px; max-height:110px; margin:0 auto 10px; display:block; border-bottom:1px solid var(--line); padding-bottom:8px;}

  .footer-nav{position:sticky; bottom:0; display:flex; justify-content:space-between; align-items:center; background:var(--paper); border-top:1px solid var(--line); padding:14px 4px; margin-top:8px;}
  .btn{border:none; border-radius:7px; padding:10px 20px; font-size:13.5px; font-weight:600; cursor:pointer; font-family:var(--sans);}
  .btn-primary{background:var(--teal); color:#fff;}
  .btn-primary:hover{background:var(--teal-dark);}
  .btn-primary:disabled{opacity:.4; cursor:not-allowed;}
  .btn-ghost{background:transparent; color:var(--ink); border:1px solid var(--line);}
  .btn-ghost:hover{border-color:var(--teal); color:var(--teal-dark);}
  .btn-print{background:var(--ink); color:var(--paper);}

  @media print{
    body{background:#fff;}
    .stepper-wrap, .footer-nav, .callout, .no-print{display:none !important;}
    .card{border:none; box-shadow:none; padding:0; margin-bottom:22px; page-break-inside:avoid;}
    .shell{max-width:100%; padding:0;}
    @page{size:A4; margin:14mm 12mm;}
  }
</style>
</head>
<body>
<div class="shell">
  <div class="app-header">
    <div class="brand">
      <div class="brand-mark">WT</div>
      <div class="brand-text">
        <h1>CWCR</h1>
        <p>WIPOTEC Checkweigher &amp; Metal Detector Commissioning</p>
      </div>
    </div>
    <div style="display:flex; align-items:center; gap:16px;">
      <a href="/" style="font-size:12px; font-weight:700; color:var(--teal-dark); text-decoration:none;">&larr; Home</a>
      <span id="versionBadge" style="font-size:11px; font-weight:700; color:var(--teal-dark); background:var(--teal-tint); border-radius:5px; padding:3px 9px;">v1.0.6.2</span>
      <div class="doc-no">Document No.<br><span id="docNoDisplay">—</span></div>
    </div>
  </div>

  <div class="stepper-wrap"><div class="stepper" id="stepper"></div></div>
  <div id="stepBody"></div>

  <div class="footer-nav no-print">
    <button class="btn btn-ghost" id="btnBack">← Back</button>
    <div style="display:flex; gap:10px;">
      <button class="btn btn-print" id="btnPrint">🖨 Preview</button>
      <button class="btn btn-primary" id="btnNext">Next →</button>
    </div>
  </div>
</div>

<script>
/* ============================================================
   CWCR — WIPOTEC Checkweigher Calibration Report
   Version: see VERSION.txt (served live via GET /version)
   This is the CWCR-packaged edition of the Calibration Report
   Generator: the same wizard as the standalone artifact, now
   served by a small local FastAPI + WeasyPrint backend (main.py,
   same directory) instead of relying only on the browser's print
   dialog. "Preview" still uses window.print(); "Generate" (last
   step) now POSTs the full `state` object as JSON to /generate-pdf
   and downloads the real PDF the server renders and returns,
   named documentNo_machineSerial_companyName.pdf.
   This file intentionally does not read from or depend on
   anything in the separate XRPV Generator project it's packaged
   alongside — it is a standalone frontend for its own backend.

   ARCHITECTURE (read this before changing anything)
   ---------------------------------------------------------------
   1. `state` (below) is the single source of truth. Every screen
      renders FROM state and writes back INTO state — there is no
      other data store except the small `localStorage` cache used
      only to remember Test Kit values between visits.
   2. The wizard has 5 kinds of steps, generated dynamically by
      computeSteps() from state.config (lane count + MDi Yes/No):
      Machine Config → Main Page → CW Test (×N lanes) →
      MD Test (×N lanes, only if MDi = Yes) → Final Summary.
   3. renderStepBody() clears #stepBody and calls the matching
      renderXxxPage() function. Each of those returns a DOM node
      built from template strings + fieldHTML()/renderChecklistTable()
      /buildLoadTable() helpers, then wires up event listeners.
   4. IMPORTANT — focus-preserving inputs: plain fields are bound
      with bindFields(), which ONLY writes to state (no re-render).
      Anything that needs a live recalculation (test-kit due-date
      colour, Linearity/Eccentricity/Repeatability Error & Result)
      uses buildLoadTable()'s updateRow()/updateAll(), which patch
      just the affected table cells directly. NEVER call
      renderStepBody() from a plain text/number input's own
      "input" listener — that was the v1.0 focus-loss bug; only
      call it from button clicks (Add/Remove row, Next/Back, etc.)
      where losing focus doesn't matter.
   5. Tolerance/Pass-Fail logic lives in classify(), eMultiplier()
      and evalLoadTest() — this is the one place to touch if the
      weighing-class bands or e-multiplier rules ever change.
   6. Two output paths: "Preview" uses the browser's native print
      dialog (@media print CSS + window.print(), no server round
      trip). "Generate" (last step) POSTs `state` as JSON to the
      backend's /generate-pdf, which renders its own Jinja2 HTML
      template with WeasyPrint and returns a PDF — that template
      (in main.py) must be updated in step with any change to the
      state shape here, or the two outputs will drift apart. Any
      on-screen element that should never appear on the printed
      report gets class="no-print".

   HOW TO EXTEND (common future changes)
   ---------------------------------------------------------------
   - Add a field to an existing card: add a line to the relevant
     makeXxx()/mainInfo default object AND a fieldHTML(...) call
     in the matching renderXxxPage() template — nothing else to
     touch, bindFields() picks it up automatically via data-path.
   - Add a whole new checklist section: reuse renderChecklistTable()
     or renderAddCountSection() — don't build a new table type.
   - Add a new step to the wizard: add an entry in computeSteps()
     and a branch in renderStepBody()'s if/else chain.
   - Change a tolerance rule: edit eMultiplier()/classify() only.

   CHANGELOG
   ---------------------------------------------------------------
   v1.0.0 — First packaged release. Lane-count + MDi configuration
     wizard; Main Page (Customer/POC, Machine Info, Weight Info,
     Test Kit with localStorage memory + 30-day due-date flag,
     System/Additional/Optional checklists); per-lane CW Test
     (Weigh Cell Info, checklist, Linearity/Eccentricity/
     Repeatability with free Test Load entry and live Pass/Fail,
     Product Dynamic Test, per-lane Operate in Good Condition);
     per-lane MD Test (physical checklist, Detection Verification
     with Ferrous/Non-Ferrous/Stainless + free "extra type" rows);
     Final Summary (global Operate in Good Condition + See in
     Comments, Service Technician signature); print/PDF via
     browser print with no-print rules for editor-only controls.
   v1.0.2 — Confirmed working. Test Kit Information rows are now free-text Equipment
     names (not fixed labels) with Add/Remove, max 10, still
     remembered via localStorage as a list; Repeatability Test is
     now managed in sets (1 set = one 0 g reading + one Test Load
     reading), default 5 sets, Add/Remove Set capped at 10 sets
     (20 individual readings); Final Summary now also shows
     Company Name; Document No. moved from Main Page to the
     Machine Configuration step; "Preview / Print" button
     relabeled "Preview"; terminal "Done" button relabeled
     "Generate" (label only for now — see chat for the proposed
     document-no_serial_company auto-filename behaviour, held back
     pending confirmation before wiring it up); Final Summary:
     both Service Technician Signature and a new Customer
     Signature block let the person choose "Sign (Touch Screen)"
     (a canvas drawing pad using Pointer Events) or "Import Image"
     (file-upload), each captured to state as a PNG data URL;
     Machine Configuration step no longer shows the Preview button
     (nothing to preview/print yet at that point in the wizard).
   v1.0.3 — WIPOTEC Test Kit Information moved from Main Page to
     Final Summary, now ordered Final Summary → Test Kit → Customer
     Signature → Service Technician Signature; step names renamed:
     "Machine Config" → "Document Setup", "Main Page — Info &
     Checklist" → "Customer Info, Machine Info & System Check
     List", "CW Test" → "Transportation Check List & Weight
     Testing", "MD Test" → "Metal Detector Check List & Testing".
   v1.0.4 — "Machine Model / Type" renamed "Model", "Machine Serial
     Number" renamed "Serial No."; every checklist table (System,
     Additional/Optional, CW, MD physical) now has "Check - all"
     and "Check good all" bulk buttons for Adjustment/Result;
     Product Dynamic Test / Spot Check gained an Article Number
     free-text field next to Article Name; Result options changed
     to Good/Bad/Failed/N-A; Detection Verification Front/Middle/
     Back results changed from PASS/FAILED/N-A to ✓/✗/N-A.
   v1.0.5 — "Model Number" renamed "Model No."; "MD Type" renamed
     "Model Type"; checklist bulk button "Check - all" renamed
     "Check no adjusted all", plus a new "Clear all" button that
     resets both Adjustment and Result to their defaults; "Final

/* ============================================================
   CALCULATION ENGINE
   ============================================================ */
function classify(measuringRange){ return Number(measuringRange) <= 10000 ? "XIII" : "XII"; }
function eMultiplier(m, wcClass){
  if (wcClass === "XIII"){
    if (m>0 && m<=500) return 1;
    if (m>500 && m<=2000) return 2;
    if (m>2000 && m<=10000) return 3;
    return null;
  } else {
    if (m>0 && m<=5000) return 1;
    if (m>5000 && m<=20000) return 2;
    if (m>20000 && m<=100000) return 3;
    return null;
  }
}
function evalLoadTest(testLoad, reading, main){
  if (reading===null||reading===""||isNaN(reading)||testLoad===null||testLoad===""||isNaN(testLoad)) return {error:null, result:null};
  const wcClass = classify(main.measuringRange);
  const error = Number(reading) - Number(testLoad);
  if (Number(testLoad) === 0){
    return { error, result: Math.abs(error) <= main.eValue ? "PASS" : "FAIL" };
  }
  const mult = eMultiplier(Number(testLoad), wcClass);
  if (mult === null) return { error, result:"FAIL" };
  return { error, result: Math.abs(error) <= mult*main.eValue ? "PASS" : "FAIL" };
}
function fmt(v, decimals){
  if (v===null || v===undefined || v==="" || isNaN(v)) return "—";
  return Number(v).toFixed(decimals);
}
function daysUntil(dateStr){
  if (!dateStr) return null;
  const due = new Date(dateStr);
  const today = new Date(); today.setHours(0,0,0,0);
  return Math.round((due - today) / (1000*60*60*24));
}

/* ============================================================

   ============================================================ */
function setDeep(obj, path, value){
  const keys = path.split(".");
  let cur = obj;
  for (let i=0;i<keys.length-1;i++) cur = cur[keys[i]];
  cur[keys[keys.length-1]] = value;
}
function fieldHTML(label, path, value, opts={}){
  const id = "f_"+path.replace(/[.\[\]]/g,"_");
  const type = opts.type || "text";
  const span = opts.span ? ` span-${opts.span}` : "";
  const req = opts.required ? " required" : "";
  const compactStyle = opts.compact ? ` style="max-width:50%; margin:0 auto;"` : "";
  if (type === "select"){
    const options = opts.options.map(o=>`<option value="${o}" ${o===value?"selected":""}>${o}</option>`).join("");
    return `<div class="field${span}${req}"${compactStyle}><label>${label}</label><select data-path="${path}" id="${id}">${options}</select></div>`;
  }
  if (type === "textarea"){
    return `<div class="field${span}${req}"${compactStyle}><label>${label}</label><textarea data-path="${path}" id="${id}" rows="${opts.rows||2}">${value||""}</textarea></div>`;
  }
  if (opts.suffix){
    return `<div class="field${span}${req}"${compactStyle}><label>${label}</label><div class="field-with-suffix"><input data-path="${path}" id="${id}" type="${type}" value="${value ?? ''}" placeholder="${opts.placeholder||''}"><span class="unit-label">${opts.suffix}</span></div></div>`;
  }
  return `<div class="field${span}${req}"${compactStyle}><label>${label}</label><input data-path="${path}" id="${id}" type="${type}" value="${value ?? ''}" placeholder="${opts.placeholder||''}"></div>`;
}
/* bindFields never triggers a re-render — it only writes into the state
   object, which is what keeps free-text/number inputs from losing focus
   after every keystroke. Anything needing a live recalculation gets its
   own listener that patches just the affected DOM nodes instead. */
function bindFields(container, targetResolver){
  container.querySelectorAll("[data-path]").forEach(inp => {
    const evt = (inp.tagName === "SELECT") ? "change" : "input";
    inp.addEventListener(evt, () => {
      const target = targetResolver ? targetResolver() : state;
      setDeep(target, inp.dataset.path, inp.value);
    });
  });
}

/* ---- Generic load-test table ---- */
function buildLoadTable(rows, getTestLoad, getDecimal, main, opts={}){
  const wrap = document.createElement("div");
  wrap.style.overflowX = "auto";
  const table = document.createElement("table");
  table.className = "tbl";
  table.innerHTML = `
    <thead><tr>
      <th style="width:8%">${opts.posLabel || "No."}</th>
      <th style="width:18%">Test Load</th>
      <th style="width:18%">Reading</th>
      <th style="width:16%">Error</th>
      <th style="width:14%">Result</th>
    </tr></thead>
    <tbody></tbody>`;
  const tbody = table.querySelector("tbody");
  rows.forEach((row, i) => {
    const tr = document.createElement("tr");
    const label = opts.labelFn ? opts.labelFn(row, i) : (row.pos || row.no || (i+1));
    tr.innerHTML = `
      <td>${label}</td>
      <td class="tl-cell">${opts.freeTestLoad ? `<div class="cell-with-suffix"><input type="number" step="any" data-tl-idx="${i}" value="${row.testLoad ?? ''}"><span class="unit-label">${main.unit}</span></div>` : ''}</td>
      <td><div class="cell-with-suffix"><input type="number" step="any" data-reading-idx="${i}" value="${row.reading ?? ''}" placeholder="reading"><span class="unit-label">${main.unit}</span></div></td>
      <td class="err-cell">—</td>
      <td class="res-cell"><span class="badge wait">—</span></td>
    `;
    tbody.appendChild(tr);
  });
  wrap.appendChild(table);

  function updateRow(i){
    const row = rows[i];
    const testLoad = getTestLoad(row, i);
    const decimals = getDecimal();
    const calc = evalLoadTest(testLoad, row.reading, main);
    const tr = tbody.children[i];
    if (!opts.freeTestLoad){
      tr.querySelector(".tl-cell").textContent = fmt(testLoad, decimals) + " " + main.unit;
    }
    tr.querySelector(".err-cell").textContent = calc.error===null ? "—" : (calc.error>=0?"+":"")+fmt(calc.error, decimals)+" "+main.unit;
    tr.querySelector(".res-cell").innerHTML = calc.result===null ? '<span class="badge wait">—</span>' : `<span class="badge ${calc.result==='PASS'?'pass':'fail'}">${calc.result}</span>`;
  }
  function updateAll(){ rows.forEach((_,i)=>updateRow(i)); }
  updateAll();

  tbody.querySelectorAll("[data-reading-idx]").forEach(inp => {
    inp.addEventListener("input", () => {
      const i = Number(inp.dataset.readingIdx);
      rows[i].reading = inp.value === "" ? null : Number(inp.value);
      updateRow(i);
    });
  });
  tbody.querySelectorAll("[data-tl-idx]").forEach(inp => {
    inp.addEventListener("input", () => {
      const i = Number(inp.dataset.tlIdx);
      rows[i].testLoad = inp.value === "" ? null : Number(inp.value);
      updateRow(i);
    });
  });
  return { el: wrap, updateAll };
}

/* ============================================================
   STEP DEFINITIONS
   ============================================================ */
let currentStepIndex = 0;

function computeSteps(){
  const steps = [{ key:"config", label:"Document Setup" }];
  if (state.config.hasMDi === null) return steps;
  steps.push({ key:"main", label:"Customer Info, Machine Info & System Check List" });
  state.lanes.forEach((lane, i) => {
    const laneLabel = state.lanes.length > 1 ? `Lane ${lane.laneNo} Transportation Check List & Weight Testing` : "Transportation Check List & Weight Testing";
    steps.push({ key:`cw-${i}`, label:laneLabel });
    if (lane.md){
      const mdLabel = state.lanes.length > 1 ? `Lane ${lane.laneNo} Metal Detector Check List & Testing` : "Metal Detector Check List & Testing";
      steps.push({ key:`md-${i}`, label:mdLabel });
    }
  });
  steps.push({ key:"review", label:"Summary" });
  return steps;
}

function renderStepper(){
  const steps = computeSteps();
  const el = document.getElementById("stepper");
  el.innerHTML = "";
  steps.forEach((s, i) => {
    if (i > 0){
      const c = document.createElement("div");
      c.className = "step-connector" + (i <= currentStepIndex ? " done" : "");
      el.appendChild(c);
    }
    const node = document.createElement("div");
    node.className = "step-node" + (i === currentStepIndex ? " active" : "") + (i < currentStepIndex ? " done" : "");
    node.innerHTML = `<div class="step-dot"><span>${i+1}</span></div><div class="step-label">${s.label}</div>`;
    node.onclick = () => { if (i <= currentStepIndex) { currentStepIndex = i; render(); } };
    el.appendChild(node);
  });
}

  renderSignatureBlock(wrap.querySelector("#custSigCard"), fr.customer, "Customer Signature", "finalReview.customer");
  renderSignatureBlock(wrap.querySelector("#techSigCard"), fr.technician, "Service Technician Signature", "finalReview.technician");

  bindFields(wrap, () => state);
  return wrap;
}

/* Reusable signature block: lets the person choose between drawing on a
   touch-screen/canvas pad or importing a signature image. Drawing is
   done with Pointer Events (covers mouse, touch and pen uniformly) and
   is captured to state as a PNG data URL on each stroke, without ever
   calling renderStepBody() mid-stroke (that would wipe the canvas). */
function renderSignatureBlock(host, person, title, pathPrefix){
  let isDraw = person.signatureMode !== "image";
  host.innerHTML = `
    <h2>${title}</h2>
    <div class="toggle-row" style="max-width:340px; margin-bottom:14px;" data-mode-toggle>
      <div class="toggle-btn ${isDraw?'selected':''}" data-mode="draw">Sign (Touch Screen)</div>
      <div class="toggle-btn ${!isDraw?'selected':''}" data-mode="image">Import Image</div>
    </div>
    <div class="sig-box" style="margin-bottom:16px;" data-sig-area></div>
    <div class="field-grid cols-2">
      ${fieldHTML("Name", `${pathPrefix}.name`, person.name)}
      ${fieldHTML("Date", `${pathPrefix}.date`, person.date, {type:"date"})}
    </div>
  `;
  const area = host.querySelector("[data-sig-area]");

  function paintArea(){
    area.innerHTML = "";
    if (isDraw){
      area.innerHTML = `
        <canvas width="500" height="160" style="width:100%; max-width:420px; height:auto; aspect-ratio:500/160; touch-action:none; border:1px solid var(--line); border-radius:8px; background:#fff; display:block; margin:0 auto 10px;"></canvas>
        <button class="btn-sm danger no-print" data-sig-clear>Clear signature</button>
      `;
      const canvas = area.querySelector("canvas");
      const ctx = canvas.getContext("2d");
      ctx.strokeStyle = "#1b2b2b"; ctx.lineWidth = 2.4; ctx.lineCap = "round"; ctx.lineJoin = "round";
      if (person.signatureDataUrl){
        const img = new Image();
        img.onload = () => ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        img.src = person.signatureDataUrl;
      }
      let drawing = false, last = null;
      function pos(e){ const r = canvas.getBoundingClientRect(); return { x:(e.clientX-r.left)*(canvas.width/r.width), y:(e.clientY-r.top)*(canvas.height/r.height) }; }
      canvas.addEventListener("pointerdown", e => { drawing = true; last = pos(e); canvas.setPointerCapture(e.pointerId); });
      canvas.addEventListener("pointermove", e => { if (!drawing) return; const p = pos(e); ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(p.x, p.y); ctx.stroke(); last = p; });
      function endStroke(){ if (drawing){ drawing = false; person.signatureDataUrl = canvas.toDataURL("image/png"); } }
      canvas.addEventListener("pointerup", endStroke);
      canvas.addEventListener("pointerleave", endStroke);
      area.querySelector("[data-sig-clear]").onclick = () => { ctx.clearRect(0,0,canvas.width,canvas.height); person.signatureDataUrl = null; };
    } else {
      area.innerHTML = `
        ${person.signatureDataUrl ? `<img class="sig-preview" src="${person.signatureDataUrl}">` : `<p style="opacity:.6; font-size:12.5px; margin:0 0 10px;">No signature imported yet</p>`}
        <input type="file" accept="image/*" class="no-print" data-sig-upload>
        ${person.signatureDataUrl ? `<div style="margin-top:8px;"><button class="btn-sm danger no-print" data-sig-clear>Remove signature</button></div>` : ""}
      `;
      area.querySelector("[data-sig-upload]").addEventListener("change", (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => { person.signatureDataUrl = reader.result; paintArea(); };
        reader.readAsDataURL(file);
      });
      const clearBtn = area.querySelector("[data-sig-clear]");
      if (clearBtn) clearBtn.onclick = () => { person.signatureDataUrl = null; paintArea(); };
    }
  }
  paintArea();

  host.querySelectorAll("[data-mode]").forEach(btn => {
    btn.onclick = () => {
      person.signatureMode = btn.dataset.mode;
      isDraw = btn.dataset.mode === "draw";
      host.querySelectorAll("[data-mode]").forEach(b => b.classList.toggle("selected", b.dataset.mode === person.signatureMode));
      paintArea();
    };
  });
}

/* ============================================================
   RENDER LOOP
   ============================================================ */
function renderStepBody(){
  const steps = computeSteps();
  if (currentStepIndex > steps.length-1) currentStepIndex = steps.length-1;
  const step = steps[currentStepIndex];
  const body = document.getElementById("stepBody");
  body.innerHTML = "";
  if (!step) return;
  if (step.key === "config") body.appendChild(renderConfigStep());
  else if (step.key === "main") body.appendChild(renderMainPage());
  else if (step.key.startsWith("cw-")) body.appendChild(renderCWPage(Number(step.key.split("-")[1])));
  else if (step.key.startsWith("md-")) body.appendChild(renderMDPage(Number(step.key.split("-")[1])));
  else if (step.key === "review") body.appendChild(renderReview());

  document.getElementById("docNoDisplay").textContent = state.mainInfo.documentNo || "—";
  renderStepper();
  updateNextEnabled();
}

function updateNextEnabled(){
  const steps = computeSteps();
  const step = steps[currentStepIndex];
  const btnNext = document.getElementById("btnNext");
  const btnBack = document.getElementById("btnBack");
  const btnPrint = document.getElementById("btnPrint");
  btnBack.disabled = currentStepIndex === 0;
  btnBack.style.opacity = currentStepIndex === 0 ? .4 : 1;
  btnPrint.style.display = (step && step.key === "config") ? "none" : "";

  let canProceed = true;
  if (step && step.key === "config") canProceed = state.config.hasMDi !== null;
  btnNext.disabled = !canProceed;
  btnNext.textContent = currentStepIndex >= steps.length - 1 ? "Generate" : "Next →";
}

function render(){ renderStepper(); renderStepBody(); }

const API_BASE_URL = "";

function showStatusBanner(message, isError){
  let el = document.getElementById("statusBanner");
  if (!el){
    el = document.createElement("div");
    el.id = "statusBanner";
    el.className = "no-print";
    el.style.cssText = "position:fixed; left:50%; bottom:84px; transform:translateX(-50%); z-index:50; padding:10px 18px; border-radius:8px; font-size:13px; font-weight:600; box-shadow:0 4px 16px rgba(0,0,0,.18); max-width:min(640px, 92vw); text-align:center; line-height:1.4;";
    document.body.appendChild(el);
  }
  el.style.background = isError ? "var(--red)" : "var(--teal)";
  el.style.color = "#fff";
  el.textContent = message;
  el.style.display = "block";
  clearTimeout(el._hideTimer);
  el._hideTimer = setTimeout(() => { el.style.display = "none"; }, isError ? 9000 : 3500);
}

async function generatePdf(){
  const btnNext = document.getElementById("btnNext");
  const originalText = btnNext.textContent;

  if (window.location.protocol === "file:"){
    showStatusBanner("This page was opened as a local file, so it has no server to generate a PDF. Double-click Run_PV.bat instead — it starts the server; then open this page from the Home screen (http://127.0.0.1:8000/).", true);
    return;
  }

  btnNext.disabled = true;
  btnNext.textContent = "Generating…";
  try{
    const response = await fetch(`${API_BASE_URL}/cwcr/generate-pdf`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(state)
    });
    if (!response.ok){
      let detail = "";
      try{ detail = (await response.json()).detail || ""; }catch(e){}
      throw new Error(detail || `Server returned ${response.status}`);
    }
    const blob = await response.blob();
    const disposition = response.headers.get("Content-Disposition") || "";
    const match = disposition.match(/filename="?([^"]+)"?/);
    const filename = match ? match[1] : "CWCR_Report.pdf";
    const url = window.URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    window.URL.revokeObjectURL(url);
    showStatusBanner("PDF generated: " + filename, false);
  }catch(err){
    const hint = (err.message === "Failed to fetch")
      ? "the server isn't reachable — make sure Run_PV.bat is running (check the \"WIPOTEC PV Server\" window in the taskbar) and that you opened this page from http://127.0.0.1:8000/, not by double-clicking the file"
      : err.message;
    showStatusBanner("Could not generate PDF — " + hint, true);
  }finally{
    btnNext.disabled = false;
    btnNext.textContent = originalText;
  }
}

document.getElementById("btnNext").addEventListener("click", () => {
  const steps = computeSteps();
  if (currentStepIndex < steps.length - 1){ currentStepIndex++; render(); window.scrollTo({top:0, behavior:"smooth"}); }
  else { generatePdf(); }
});
document.getElementById("btnBack").addEventListener("click", () => {
  if (currentStepIndex > 0){ currentStepIndex--; render(); window.scrollTo({top:0, behavior:"smooth"}); }
});
document.getElementById("btnPrint").addEventListener("click", () => window.print());

fetch(`${API_BASE_URL}/cwcr/version`).then(r => r.json()).then(d => {
  const badge = document.getElementById("versionBadge");
  if (badge && d.version) badge.textContent = "v" + d.version;
}).catch(() => { /* backend not reachable yet — keep the static fallback badge */ });

loadTestKitMemory();
rebuildLanes();
render();
</script>
